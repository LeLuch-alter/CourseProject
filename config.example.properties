# Copy this file to config.properties and fill in your project values.
# Supabase Dashboard -> Project Settings -> API Keys.
#
# Use ONLY the publishable (anon) key here. Never put the service_role / secret key
# into this file: the desktop app is given to users and its files can be read.
supabase.url=https://YOUR-PROJECT-REF.supabase.co
supabase.publishableKey=sb_publishable_XXXXXXXXXXXXXXXX
